<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Siren.ng — Verified emergency alerts for Lagos neighbourhoods</title>
    <meta
      name="description"
      content="Report an emergency on WhatsApp. A Siren coordinator confirms it, your neighbours in the same LGA are alerted, and emergency services are notified."
    />
    <meta name="theme-color" content="#1B2A4A" />
    <link rel="canonical" href="https://siren.ng/" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Siren.ng" />
    <meta property="og:title" content="Siren.ng — Verified emergency alerts for Lagos neighbourhoods" />
    <meta
      property="og:description"
      content="Report an emergency on WhatsApp. A Siren coordinator confirms it, your neighbours in the same LGA are alerted, and emergency services are notified."
    />
    <meta property="og:url" content="https://siren.ng/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Fonts: preconnect + async load (not @import in CSS, which blocked first
      paint). Only the weights actually used are requested.

      Archivo carries the display sizes and the body copy: a tall x-height that
      survives a mid-range screen in daylight, which is the real reading
      condition for this product. IBM Plex Mono appears only on literal
      WhatsApp commands (WATCH, STOP) — strings a resident must type exactly,
      so the mono is carrying information, not decoration.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
